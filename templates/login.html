<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Pablo Rail | ورود</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Vazirmatn",sans-serif;
}

body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;

    background:
        radial-gradient(circle at 50% 0%,rgba(34,211,238,.15),transparent 40%),
        radial-gradient(circle at 10% 100%,rgba(37,99,235,.13),transparent 40%),
        #050912;

    color:#fff;
}

.login{
    width:100%;
    max-width:390px;
    padding:25px 20px;

    border-radius:26px;

    background:rgba(9,18,32,.88);
    border:1px solid rgba(34,211,238,.14);

    box-shadow:
        0 25px 70px rgba(0,0,0,.6),
        0 0 45px rgba(34,211,238,.05);

    backdrop-filter:blur(18px);
}

.logo{
    width:68px;
    height:68px;
    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:linear-gradient(135deg,#22d3ee,#2563eb);

    box-shadow:0 0 35px rgba(34,211,238,.25);

    font-size:30px;
}

h1{
    text-align:center;
    font-size:22px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#718096;
    font-size:10px;
    margin-top:5px;
    margin-bottom:23px;
}

.error{
    padding:10px;
    border-radius:12px;
    margin-bottom:14px;

    background:rgba(244,63,94,.08);
    border:1px solid rgba(244,63,94,.2);

    color:#fb7185;
    font-size:10px;
    text-align:center;
}

.group{
    margin-bottom:13px;
}

label{
    display:block;
    color:#94a3b8;
    font-size:10px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;

    border-radius:13px;
    border:1px solid #26364e;

    outline:none;

    background:#060d17;
    color:white;

    font-size:12px;
}

input:focus{
    border-color:#22d3ee;
    box-shadow:0 0 0 3px rgba(34,211,238,.06);
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:13px;

    margin-top:6px;

    background:linear-gradient(135deg,#22d3ee,#2563eb);

    color:white;
    font-family:inherit;
    font-size:12px;
    font-weight:900;

    box-shadow:0 8px 25px rgba(34,211,238,.16);
}

button:active{
    transform:scale(.98);
}

.footer{
    text-align:center;
    margin-top:22px;
    padding-top:14px;

    border-top:1px solid #172235;

    color:#526175;
    font-size:9px;
}

.footer a{
    color:#22d3ee;
    text-decoration:none;
    font-weight:900;
}

</style>
</head>

<body>

<div class="login">

    <div class="logo">
        🚆
    </div>

    <h1>Pablo Rail</h1>

    <div class="subtitle">
        پنل مدیریت اختصاصی سرور و کاربران
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="group">

            <label>
                نام کاربری
            </label>

            <input
                type="text"
                name="username"
                required
                autocomplete="username"
                placeholder="نام کاربری"
            >

        </div>

        <div class="group">

            <label>
                رمز عبور
            </label>

            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="رمز عبور"
            >

        </div>

        <button type="submit">
            ورود به پنل مدیریت
        </button>

    </form>

    <div class="footer">

        ساخته شده توسط

        <a href="https://t.me/pablo_artor" target="_blank">
            Pablo
        </a>

        ❤️

    </div>

</div>

</body>
</html>
